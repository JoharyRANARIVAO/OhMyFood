<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La palette du goût - Ohmyfood</title>
    <link rel="stylesheet" href="../css/menu.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Shrikhand&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="header">
      <a href="../index.html" class="back-arrow">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <img
        src="/assets/Images et textes Ohmyfood/images/logo/ohmyfood@2x.svg"
        alt="Logo Ohmyfood"
        class="header__logo"
      />
    </header>

    <main>
      <div class="banner">
        <img
          src="/assets/Images et textes Ohmyfood/images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg"
          alt="La palette du goût"
          class="banner__img"
        />
      </div>

      <section class="menu">
        <div class="menu__title">
          <h1>La palette du goût</h1>
          <div class="heart">
            <input type="checkbox" id="heart" class="heart__checkbox" />
            <label for="heart" class="heart__label">
              <i class="fa-regular fa-heart"></i>
              <i class="fa-solid fa-heart"></i>
            </label>
          </div>
        </div>

        <!-- ENTRÉES -->
        <section class="menu__section">
          <h2 class="menu__section-title">Entrées</h2>
          <div class="menu__list">
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Fricassée d'escargots</h3>
                <p>Au piment d'Espelette</p>
              </div>
              <div class="menu__price">25€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Foie gras de canard mi-cuit</h3>
                <p>Et ses copeaux de truffe noire</p>
              </div>
              <div class="menu__price">35€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Œuf au plat</h3>
                <p>Assaisonné à la truffe sur lit de caviar</p>
              </div>
              <div class="menu__price">20€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
          </div>
        </section>

        <!-- PLATS -->
        <section class="menu__section">
          <h2 class="menu__section-title">Plats</h2>
          <div class="menu__list">
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Filet de bœuf aux herbes</h3>
                <p>Accompagné de sa ribambelle de légumes</p>
              </div>
              <div class="menu__price">40€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Parmentier de queue de bœuf</h3>
                <p>À la truffe noire sur sa purée de panais</p>
              </div>
              <div class="menu__price">35€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Filet de turbot</h3>
                <p>Aux agrumes</p>
              </div>
              <div class="menu__price">44€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
          </div>
        </section>

        <!-- DESSERTS -->
        <section class="menu__section">
          <h2 class="menu__section-title">Desserts</h2>
          <div class="menu__list">
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Paris-Brest</h3>
                <p>Revisité</p>
              </div>
              <div class="menu__price">18€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Macaron au chocolat d'exception</h3>
                <p>Et glace à la vanille de Madagascar</p>
              </div>
              <div class="menu__price">22€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
            <label class="menu__item">
              <input type="checkbox" />
              <div class="menu__info">
                <h3>Mousse au chocolat</h3>
                <p>Au piment d'Espelette et à la truffe noire</p>
              </div>
              <div class="menu__price">23€</div>
              <div class="menu__check"><i class="fa-solid fa-check"></i></div>
            </label>
          </div>
        </section>

        <!-- BUTTON -->
        <div class="menu__cta">
          <button class="menu__btn">Commander</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__logo">ohmyfood</p>
      <div class="footer__links">
        <a href="#"
          ><i class="fa-solid fa-utensils"></i> Proposer un restaurant</a
        >
        <a href="#"
          ><i class="fa-solid fa-handshake-angle"></i> Devenir partenaire</a
        >
        <a href="#">Mentions légales</a>
        <a href="#">Contact</a>
      </div>
    </footer>
  </body>
</html>
